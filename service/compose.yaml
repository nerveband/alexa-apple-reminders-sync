services:
  reminders-sync:
    build: .
    container_name: reminders-sync
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - n8n
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  n8n:
    external: true
    name: ${N8N_NETWORK:-n8n_default}
